# golangci-lint configuration for v2.5.0+
# See: https://golangci-lint.run/docs/configuration/

version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly

severity:
  default: error

linters:
  # v2 config does not support `disable-all`; use `default: none` instead
  default: none
  enable:
    # Core correctness.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Error handling.
    - errorlint
    - errname
    - errchkjson
    - nilerr
    - nilnil
    - nilnesserr

    # Backend resource safety.
    - bidichk
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - durationcheck
    - fatcontext
    - gosec

    # Code hygiene.
    - asciicheck
    - dupword
    - gocheckcompilerdirectives
    - iface
    - makezero
    - mirror
    - misspell
    - musttag
    - nolintlint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - unconvert
    - unparam
    - wastedassign

    # Go modernization.
    - copyloopvar
    - exptostd
    - intrange
    - modernize
    - perfsprint
    - usestdlibvars

    # Broad complementary suite (diagnostic, style, performance).
    - gocritic

    # Test quality.
    - testifylint
    - thelper
    - tparallel
    - usetesting

    # Project constraints.
    - depguard
    - forbidigo
    - gomoddirectives

    # Project-specific checks.
    # canonicalheader v1.1.2 panics on parameterized method calls (go1.27);
    # re-enable once an upstream release handles them.
    # - canonicalheader
    - loggercheck
    - spancheck

    # Documentation.
    - godoclint

  # Linter-specific settings (moved under linters.settings for v2)
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: "errors"
              desc: "Use github.com/cockroachdb/errors instead"
            - pkg: "github.com/pkg/errors"
              desc: "Use github.com/cockroachdb/errors instead"
        # Framework code imports the internal packages behind the public
        # forwarding packages; the forwards serve projects (AGENTS.md, package
        # ownership and internal import direction). The files left out are the
        # ones written as project code: godoc examples, the module sources
        # gg module copy copies into a project (internal/model/<module> and
        # internal/service/<module>), the middleware source files the module
        # manifests name, and module/helloworld, the module example projects
        # are pointed to; so is the external test of a forwarding package,
        # which imports the package it tests. A trailing $ matches the package
        # itself and not the packages under it.
        forwarders:
          files:
            - "$all"
            - "!**/example_*_test.go"
            - "!**/modelschema/modelschema_test.go"
            - "!**/internal/model/**"
            - "!**/internal/service/**"
            - "!**/middleware/iam_session.go"
            - "!**/middleware/authz.go"
            - "!**/module/helloworld/**"
          deny:
            - pkg: "github.com/hydroan/gst$"
              desc: "framework code imports github.com/hydroan/gst/internal/types"
            - pkg: "github.com/hydroan/gst/model$"
              desc: "framework code imports github.com/hydroan/gst/internal/modelregistry"
            - pkg: "github.com/hydroan/gst/service$"
              desc: "framework code imports github.com/hydroan/gst/internal/serviceregistry"
            - pkg: "github.com/hydroan/gst/sse$"
              desc: "framework code imports github.com/hydroan/gst/internal/sse"
            - pkg: "github.com/hydroan/gst/response$"
              desc: "framework code imports github.com/hydroan/gst/internal/response"
            - pkg: "github.com/hydroan/gst/requestctx$"
              desc: "framework code imports github.com/hydroan/gst/internal/requestctx"
            - pkg: "github.com/hydroan/gst/testutil$"
              desc: "framework code imports github.com/hydroan/gst/internal/testutil"
            - pkg: "github.com/hydroan/gst/router$"
              desc: "framework code imports github.com/hydroan/gst/internal/router"
            - pkg: "github.com/hydroan/gst/modelschema$"
              desc: "framework code imports github.com/hydroan/gst/internal/modelschema"
        # The same rule for the public middleware package, which the
        # registration packages of copyable modules also import: the handler
        # they register is a middleware source file gg module copy carries into
        # a project, so it lives in the public package, while the registration
        # call goes through internal/middleware.
        middleware-forwarder:
          files:
            - "$all"
            - "!**/example_*_test.go"
            - "!**/internal/model/**"
            - "!**/internal/service/**"
            - "!**/middleware/iam_session.go"
            - "!**/middleware/authz.go"
            - "!**/module/helloworld/**"
            - "!**/module/iam/register.go"
            - "!**/module/authz/register.go"
          deny:
            - pkg: "github.com/hydroan/gst/middleware$"
              desc: "framework code imports github.com/hydroan/gst/internal/middleware; only the handlers a module registers come from the public package"

    errcheck:
      check-type-assertions: true
      exclude-functions:
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)

    forbidigo:
      # Refusing a request outside the controller path goes through
      # response.Abort, which is the single place the API envelope is written.
      # gin's own aborts stay reachable on *gin.Context forever, so nothing but
      # this rule stops the next middleware from writing a second envelope by
      # hand — which is how the response code the body logger records came to be
      # present on the framework path and missing from every other one.
      forbid:
        - pattern: '^.*\.AbortWithStatusJSON$'
          msg: "write the envelope through response.Abort instead of building it by hand"
        - pattern: '^.*\.AbortWithStatus$'
          msg: "an empty body carries neither a code nor a trace id; refuse through response.Abort"

    godoclint:
      # Default set of rules to enable.
      # Possible values are: `basic`, `all` or `none`.
      # Default: `basic` (enables `pkg-doc`, `single-pkg-doc`, `start-with-name`, and `deprecated`)
      default: basic
      # List of rules to enable in addition to the default set.
      enable:
        # Check proper package-level godoc, if any.
        - pkg-doc
        # Assert at most one godoc per package.
        - single-pkg-doc
        # Check godocs start with the corresponding symbol name.
        - start-with-name
        # Check deprecated symbols have proper deprecation notice.
        - deprecated

    govet:
      # shadow and nilness are not part of the default go vet analyzer set;
      # they replace the standalone shadow/nilness binaries previously run by make.
      enable:
        - shadow
        - nilness
        - unusedwrite
        - reflectvaluecompare
        - deepequalerrors
        - sortslice

    misspell:
      locale: US

    recvcheck:
      # Design, GetTableName, Purge and Indexes are stateless declaration
      # methods that use value receivers by framework convention, while
      # stateful hooks require pointer receivers.
      exclusions:
        - "*.Design"
        - "*.GetTableName"
        - "*.Purge"
        - "*.Indexes"

    revive:
      rules:
        - name: blank-imports
        - name: dot-imports
          arguments:
            - allowedPackages:
                - "github.com/hydroan/gst/dsl"
                - "github.com/hydroan/gst/internal/response"
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming

    staticcheck:
      checks: ["all", "-QF1008"]
      dot-import-whitelist:
        - github.com/hydroan/gst/dsl
        - github.com/hydroan/gst/internal/response

  # Exclusions moved under linters.exclusions for v2
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # Relax complexity in tests. unparam is excluded because test helpers
      # commonly keep parameters for signature symmetry across cases.
      - path: _test\.go
        linters:
          - gosec
          - godoclint
          - unparam
      # The gofix //go:fix directive is valid but not yet in
      # gocheckcompilerdirectives' known directive list.
      - linters:
          - gocheckcompilerdirectives
        text: "//go:fix"
      # Revive var-naming: ignore ALL_CAPS (redundant with staticcheck) and underscores in names.
      - linters:
          - revive
        text: "don't use (ALL_CAPS|underscores) in Go names"
      # Allow package names "types" and "util" (meaningful in our context).
      - linters:
          - revive
        text: "avoid meaningless package names"
        path: "^(types|util)/|.*/(types|util)/"
      # A CORS preflight is answered with a bare 204 by protocol: the headers
      # are the whole answer and there is no body to put an envelope in.
      - linters:
          - forbidigo
        path: internal/middleware/cors\.go
      # Constants in these two packages are named after the string each one
      # stands for: environment variables in config, context keys, query
      # parameters, header names and route phases in consts. The
      # ALL_CAPS and underscored spellings are deliberate and have to match
      # those strings exactly, and an explicit staticcheck checks list turns
      # off golangci's own ST1003 exclusion. The paths are anchored so that
      # packages merely named config elsewhere in the tree stay checked.
      - path: ^(config|consts)/
        linters:
          - staticcheck
        text: "ST1003"
      # G101 keys off names containing token/password/secret, which every
      # credential-related environment variable name in config matches.
      - path: ^config/
        linters:
          - gosec
        text: "G101"

issues:
  # Increase max issues to avoid truncation
  max-same-issues: 100
