# golangci-lint configuration for v2.5.0+
# See: https://golangci-lint.run/docs/configuration/

version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly

severity:
  default: error

linters:
  # v2 config does not support `disable-all`; use `default: none` instead
  default: none
  enable:
    # Core correctness.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Error handling.
    - errorlint
    - errname
    - errchkjson
    - nilerr
    - nilnil
    - nilnesserr

    # Backend resource safety.
    - bidichk
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - durationcheck
    - fatcontext
    - gosec

    # Code hygiene.
    - asciicheck
    - dupword
    - gocheckcompilerdirectives
    - iface
    - makezero
    - mirror
    - misspell
    - musttag
    - nolintlint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - unconvert
    - unparam
    - wastedassign

    # Go modernization.
    - copyloopvar
    - exptostd
    - intrange
    - modernize
    - perfsprint
    - usestdlibvars

    # Broad complementary suite (diagnostic, style, performance).
    - gocritic

    # Test quality.
    - testifylint
    - thelper
    - tparallel
    - usetesting

    # Project constraints.
    - depguard
    - forbidigo
    - gomoddirectives
    - gomodguard_v2

    # Project-specific checks.
    # canonicalheader v1.1.2 panics on parameterized method calls (go1.27);
    # re-enable once an upstream release handles them.
    # - canonicalheader
    - loggercheck
    - spancheck

    # Documentation.
    - godoclint

  # Linter-specific settings (moved under linters.settings for v2)
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: "errors"
              desc: "Use github.com/cockroachdb/errors instead"
            - pkg: "github.com/pkg/errors"
              desc: "Use github.com/cockroachdb/errors instead"

    errcheck:
      check-type-assertions: true
      exclude-functions:
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)

    forbidigo:
      # Refusing a request outside the controller path goes through
      # response.Abort, which is the single place the API envelope is written.
      # gin's own aborts stay reachable on *gin.Context forever, so nothing but
      # this rule stops the next middleware from writing a second envelope by
      # hand — which is how the response code the body logger records came to be
      # present on the framework path and missing from every other one.
      forbid:
        - pattern: '^.*\.AbortWithStatusJSON$'
          msg: "write the envelope through response.Abort instead of building it by hand"
        - pattern: '^.*\.AbortWithStatus$'
          msg: "an empty body carries neither a code nor a trace id; refuse through response.Abort"

    godoclint:
      # Default set of rules to enable.
      # Possible values are: `basic`, `all` or `none`.
      # Default: `basic` (enables `pkg-doc`, `single-pkg-doc`, `start-with-name`, and `deprecated`)
      default: basic
      # List of rules to enable in addition to the default set.
      enable:
        # Check proper package-level godoc, if any.
        - pkg-doc
        # Assert at most one godoc per package.
        - single-pkg-doc
        # Check godocs start with the corresponding symbol name.
        - start-with-name
        # Check deprecated symbols have proper deprecation notice.
        - deprecated

    govet:
      # shadow and nilness are not part of the default go vet analyzer set;
      # they replace the standalone shadow/nilness binaries previously run by make.
      enable:
        - shadow
        - nilness
        - unusedwrite
        - reflectvaluecompare
        - deepequalerrors
        - sortslice

    misspell:
      locale: US

    recvcheck:
      # Design, GetTableName, Purge and Indexes are stateless declaration
      # methods that use value receivers by framework convention, while
      # stateful hooks require pointer receivers.
      exclusions:
        - "*.Design"
        - "*.GetTableName"
        - "*.Purge"
        - "*.Indexes"

    revive:
      rules:
        - name: blank-imports
        - name: dot-imports
          arguments:
            - allowedPackages:
                - "github.com/hydroan/gst/dsl"
                - "github.com/hydroan/gst/internal/response"
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming

    staticcheck:
      # SA4023 is the only check requiring the nilness fact, whose analyzer in
      # staticcheck v0.8.0-rc.1 panics on getsentry/sentry-go ("unhandled
      # builtin recover"); dropping the check prunes the fact from the run.
      # govet's nilness analyzer still covers nil-consistency independently.
      # Re-enable once a stable staticcheck release fixes the fact analyzer.
      checks: ["all", "-QF1008", "-SA4023"]
      dot-import-whitelist:
        - github.com/hydroan/gst/dsl
        - github.com/hydroan/gst/internal/response

  # Exclusions moved under linters.exclusions for v2
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # Relax complexity in tests. unparam is excluded because test helpers
      # commonly keep parameters for signature symmetry across cases.
      - path: _test\.go
        linters:
          - gosec
          - godoclint
          - unparam
      # The gofix //go:fix directive is valid but not yet in
      # gocheckcompilerdirectives' known directive list.
      - linters:
          - gocheckcompilerdirectives
        text: "//go:fix"
      # Revive var-naming: ignore ALL_CAPS (redundant with staticcheck) and underscores in names.
      - linters:
          - revive
        text: "don't use (ALL_CAPS|underscores) in Go names"
      # Allow package names "types" and "util" (meaningful in our context).
      - linters:
          - revive
        text: "avoid meaningless package names"
        path: "^(types|util)/|.*/(types|util)/"
      # A CORS preflight is answered with a bare 204 by protocol: the headers
      # are the whole answer and there is no body to put an envelope in.
      - linters:
          - forbidigo
        path: middleware/cors\.go

issues:
  # Increase max issues to avoid truncation
  max-same-issues: 100
