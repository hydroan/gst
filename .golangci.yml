# golangci-lint configuration for v2.5.0+
# See: https://golangci-lint.run/docs/configuration/

version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly

severity:
  default: error

linters:
  # v2 config does not support `disable-all`; use `default: none` instead
  default: none
  enable:
    # Core correctness.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Error handling.
    - errorlint
    - errname
    - errchkjson
    - nilerr
    - nilnil
    - nilnesserr

    # Backend resource safety.
    - bidichk
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - durationcheck
    - fatcontext
    - gosec

    # Code hygiene.
    - asciicheck
    - dupword
    - gocheckcompilerdirectives
    - iface
    - makezero
    - mirror
    - misspell
    - musttag
    - nolintlint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - unconvert
    - unparam
    - wastedassign

    # Go modernization.
    - copyloopvar
    - exptostd
    - intrange
    - modernize
    - perfsprint
    - usestdlibvars

    # Broad complementary suite (diagnostic, style, performance).
    - gocritic

    # Test quality.
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - usetesting

    # Project constraints.
    - depguard
    - forbidigo
    - gomoddirectives
    - importas

    # Project-specific checks.
    # canonicalheader v1.1.2 panics on parameterized method calls (go1.27);
    # re-enable once an upstream release handles them.
    # - canonicalheader
    - loggercheck
    - spancheck

    # Documentation.
    - godoclint

  # Linter-specific settings (moved under linters.settings for v2)
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: "errors"
              desc: "Use github.com/cockroachdb/errors instead"
            - pkg: "github.com/pkg/errors"
              desc: "Use github.com/cockroachdb/errors instead"
        # Framework code imports the internal packages behind the public
        # forwarding packages; the forwards serve projects (CLAUDE.md, package
        # ownership and internal import direction). The files left out are the
        # ones written as project code: godoc examples, the module sources
        # gg module copy copies into a project (internal/model/<module> and
        # internal/service/<module>), the middleware source files the module
        # manifests name, and module/helloworld, the module example projects
        # are pointed to; so are the external tests of a forwarding package,
        # which import the package they test. A trailing $ matches the package
        # itself and not the packages under it.
        forwarders:
          files:
            - "$all"
            - "!**/example_*_test.go"
            - "!**/error_test.go"
            - "!**/modelschema/modelschema_test.go"
            - "!**/service/service_bench_test.go"
            - "!**/service/service_test.go"
            - "!**/internal/model/**"
            - "!**/internal/service/**"
            - "!**/middleware/iam_session.go"
            - "!**/middleware/authz.go"
            - "!**/interceptor/iam_session.go"
            - "!**/interceptor/authz.go"
            - "!**/module/helloworld/**"
            - "!**/module/version/version.go"
          deny:
            - pkg: "github.com/hydroan/gst$"
              desc: "framework code imports github.com/hydroan/gst/internal/types"
            - pkg: "github.com/hydroan/gst/dsl$"
              desc: "framework code imports github.com/hydroan/gst/internal/dsl; the public package holds the keywords model files call"
            - pkg: "github.com/hydroan/gst/model$"
              desc: "framework code imports github.com/hydroan/gst/internal/modelregistry"
            - pkg: "github.com/hydroan/gst/service$"
              desc: "framework code imports github.com/hydroan/gst/internal/serviceregistry"
            - pkg: "github.com/hydroan/gst/sse$"
              desc: "framework code imports github.com/hydroan/gst/internal/sse"
            - pkg: "github.com/hydroan/gst/response$"
              desc: "framework code imports github.com/hydroan/gst/internal/response"
            - pkg: "github.com/hydroan/gst/requestctx$"
              desc: "framework code imports github.com/hydroan/gst/internal/requestctx"
            - pkg: "github.com/hydroan/gst/consts$"
              desc: "framework code imports github.com/hydroan/gst/internal/consts"
            - pkg: "github.com/hydroan/gst/testutil$"
              desc: "framework code imports github.com/hydroan/gst/internal/testutil"
            - pkg: "github.com/hydroan/gst/router$"
              desc: "framework code imports github.com/hydroan/gst/internal/router"
            - pkg: "github.com/hydroan/gst/modelschema$"
              desc: "framework code imports github.com/hydroan/gst/internal/modelschema"
        # The same rule for the public middleware package: the handlers of
        # the copyable modules are middleware source files gg module copy
        # carries into a project, so they live in the public package, and a
        # project mounts them itself. The package's external tests, and the
        # module tests mounting them as a project does, are left out as
        # above.
        middleware-forwarder:
          files:
            - "$all"
            - "!**/example_*_test.go"
            - "!**/middleware/authz_test.go"
            - "!**/middleware/ip_filter_test.go"
            - "!**/middleware/timeout_test.go"
            - "!**/internal/model/**"
            - "!**/internal/service/**"
            - "!**/module/helloworld/**"
            - "!**/module/iam/register_test.go"
            - "!**/module/authz/register_test.go"
            - "!**/module/logmgmt/register_test.go"
            - "!**/module/mfa/register_test.go"
          deny:
            - pkg: "github.com/hydroan/gst/middleware$"
              desc: "framework code imports github.com/hydroan/gst/internal/middleware; only the handlers of the modules come from the public package, mounted by the project"
        # The same rule for the public interceptor package, the gRPC
        # counterpart of middleware: the interceptors of the modules are
        # source files gg module copy carries into a project, so they live in
        # the public package, and a project mounts them itself. The package's
        # external tests and the module tests mounting them as a project does
        # are left out.
        interceptor-forwarder:
          files:
            - "$all"
            - "!**/interceptor/interceptor_test.go"
            - "!**/interceptor/jwt_test.go"
            - "!**/module/iam/register_test.go"
            - "!**/module/authz/register_test.go"
          deny:
            - pkg: "github.com/hydroan/gst/interceptor$"
              desc: "framework code imports github.com/hydroan/gst/internal/grpcserver; only the interceptors of the modules come from the public package, mounted by the project"
        # The same rule for the public grpc package, which forwards to the
        # server package and the controller: the interceptors of the modules
        # and the public interceptor package, its counterpart of middleware,
        # spell the call's types by it, and the package's external tests and
        # the module tests mounting them as a project does are left out.
        grpc-forwarder:
          files:
            - "$all"
            - "!**/grpc/*_test.go"
            - "!**/interceptor/*.go"
            - "!**/module/iam/interceptor_test.go"
            - "!**/module/authz/interceptor_test.go"
          deny:
            - pkg: "github.com/hydroan/gst/grpc$"
              desc: "framework code imports github.com/hydroan/gst/internal/grpcserver and github.com/hydroan/gst/internal/controller; the public package forwards to them for the generated code and the project"
        # Only the gg command prints. The packages it runs return what they
        # found, or report progress through callbacks the command passes, and
        # the command decides how that shows.
        clioutput:
          files:
            - "$all"
            - "!**/cmd/gg/**"
          deny:
            - pkg: "github.com/hydroan/gst/internal/clioutput$"
              desc: "only the gg command prints; return the result, or take a progress callback the command passes"
        # The HTTP line and the gRPC line share no code (CLAUDE.md, the two
        # transports never touch each other): the packages serving HTTP
        # requests, the router, its middleware and the registration of the
        # modules, never import the gRPC listener or its interceptors, and the
        # packages serving gRPC calls never import the router or its
        # middleware; bootstrap alone wires both. The tests are left out, the
        # module tests mounting both lines the way a project does. depguard
        # matches the absolute path of a file, so a pattern names a package by
        # its directory's name, which names the public package and the
        # internal one under it alike.
        http-line:
          files:
            - "**/middleware/**"
            - "**/router/**"
            - "**/module/*/register.go"
            - "!$test"
          deny:
            - pkg: "github.com/hydroan/gst/interceptor$"
              desc: "the HTTP line never imports the gRPC line; an interceptor is the gRPC listener's"
            - pkg: "github.com/hydroan/gst/internal/grpcserver$"
              desc: "the HTTP line never imports the gRPC line; the listener is bootstrap's to wire"
            - pkg: "github.com/hydroan/gst/grpc$"
              desc: "the HTTP line never imports the gRPC line; the public grpc package serves the generated code and the interceptors"
        grpc-line:
          files:
            - "**/grpc/**"
            - "**/grpcserver/**"
            - "**/interceptor/**"
            - "!$test"
          deny:
            - pkg: "github.com/hydroan/gst/middleware$"
              desc: "the gRPC line never imports the HTTP line; a middleware is the router's"
            - pkg: "github.com/hydroan/gst/internal/middleware$"
              desc: "the gRPC line never imports the HTTP line; a middleware is the router's"
            - pkg: "github.com/hydroan/gst/router$"
              desc: "the gRPC line never imports the HTTP line; the router is bootstrap's to wire"
            - pkg: "github.com/hydroan/gst/internal/router$"
              desc: "the gRPC line never imports the HTTP line; the router is bootstrap's to wire"

    errcheck:
      check-type-assertions: true
      exclude-functions:
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)

    forbidigo:
      # Refusing a request outside the controller path goes through
      # response.Abort or response.AbortError, the places the API envelope is
      # written. gin's own aborts stay reachable on *gin.Context forever, so
      # nothing but this rule stops the next middleware from writing a second
      # envelope shape by hand.
      forbid:
        - pattern: '^.*\.AbortWithStatusJSON$'
          msg: "write the envelope through response.Abort instead of building it by hand"
        - pattern: '^.*\.AbortWithStatus$'
          msg: "an empty body carries no envelope and no trace id; refuse through response.Abort"

    godoclint:
      # Default set of rules to enable.
      # Possible values are: `basic`, `all` or `none`.
      # Default: `basic` (enables `pkg-doc`, `single-pkg-doc`, `start-with-name`, and `deprecated`)
      default: basic
      # List of rules to enable in addition to the default set.
      enable:
        # Check proper package-level godoc, if any.
        - pkg-doc
        # Assert at most one godoc per package.
        - single-pkg-doc
        # Check godocs start with the corresponding symbol name.
        - start-with-name
        # Check deprecated symbols have proper deprecation notice.
        - deprecated

    govet:
      # shadow and nilness are not part of the default go vet analyzer set;
      # make runs them through golangci-lint rather than as standalone binaries.
      enable:
        - shadow
        - nilness
        - unusedwrite
        - reflectvaluecompare
        - deepequalerrors
        - sortslice

    importas:
      # A package a reader meets beside another of the same name goes under
      # one alias wherever it is imported; every other alias is held to a
      # clash in its file by the framework's self check (see
      # internal/cmd/selfcheck), which reads this list.
      no-unaliased: true
      alias:
        # The framework's own packages named like a well-known third-party
        # package.
        - pkg: github.com/hydroan/gst/otel
          alias: gstotel
        - pkg: github.com/hydroan/gst/grpc
          alias: gstgrpc
        - pkg: github.com/hydroan/gst/redis
          alias: gstredis
        - pkg: github.com/hydroan/gst/database/mysql
          alias: gstmysql
        - pkg: github.com/hydroan/gst/database/postgres
          alias: gstpostgres
        - pkg: github.com/hydroan/gst/database/sqlite
          alias: gstsqlite
        # Third-party packages named like a package of the framework or of
        # the standard library.
        - pkg: gorm.io/gorm/logger
          alias: gormlogger
        - pkg: gorm.io/gorm/schema
          alias: gormschema
        - pkg: github.com/casbin/casbin/v3/model
          alias: casbinmodel
        - pkg: github.com/gin-gonic/gin/codec/json
          alias: ginjson

    misspell:
      locale: US
      ignore-rules:
        - importas # the linter's name

    recvcheck:
      # Design, GetTableName, Purge and Indexes are stateless declaration
      # methods that use value receivers by framework convention, while
      # stateful hooks require pointer receivers.
      exclusions:
        - "*.Design"
        - "*.GetTableName"
        - "*.Purge"
        - "*.Indexes"

    revive:
      rules:
        - name: blank-imports
        - name: dot-imports
          arguments:
            - allowedPackages:
                - "github.com/hydroan/gst/dsl"
                - "github.com/hydroan/gst/internal/response"
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming

    staticcheck:
      checks: ["all", "-QF1008"]
      dot-import-whitelist:
        - github.com/hydroan/gst/dsl

    testpackage:
      # A test file tests its package from outside, through the API callers
      # see, unless its name ends in _internal_test.go -- the form gg check
      # already pairs with a source file (foo_internal_test.go is the internal
      # test of foo.go). The suffix ends the name, so a benchmark is
      # foo_benchmark_internal_test.go. export_test.go gets no pass: the name
      # cannot tell a file that re-exports internals from one that tests an
      # export.go. A main package stays allowed: nothing imports it, so its
      # tests have no outside to test from.
      skip-regexp: _internal_test\.go$
      allow-packages:
        - main

  # Exclusions moved under linters.exclusions for v2
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # Relax complexity in tests. unparam is excluded because test helpers
      # commonly keep parameters for signature symmetry across cases.
      - path: _test\.go
        linters:
          - gosec
          - godoclint
          - unparam
      # The gofix //go:fix directive is valid but not yet in
      # gocheckcompilerdirectives' known directive list.
      - linters:
          - gocheckcompilerdirectives
        text: "//go:fix"
      # Revive var-naming: ignore ALL_CAPS (redundant with staticcheck) and underscores in names.
      - linters:
          - revive
        text: "don't use (ALL_CAPS|underscores) in Go names"
      # Allow package names "types" and "util" (meaningful in our context).
      - linters:
          - revive
        text: "avoid meaningless package names"
        path: "^(types|util)/|.*/(types|util)/"
      # A CORS preflight is answered with a bare 204 by protocol: the headers
      # are the whole answer and there is no body to put an envelope in.
      - linters:
          - forbidigo
        path: internal/middleware/cors\.go
      # Constants in these packages are named after the string each one
      # stands for: environment variables in config, context keys, query
      # parameters, header names and route phases in internal/consts and the
      # public consts forwarding them. The ALL_CAPS and underscored spellings
      # are deliberate and have to match those strings exactly, and an
      # explicit staticcheck checks list turns off golangci's own ST1003
      # exclusion. The paths are anchored so that packages merely named
      # config elsewhere in the tree stay checked.
      - path: ^(config|consts|internal/consts)/
        linters:
          - staticcheck
        text: "ST1003"
      # G101 keys off names containing token/password/secret, which every
      # credential-related environment variable name in config matches.
      - path: ^config/
        linters:
          - gosec
        text: "G101"

issues:
  # Increase max issues to avoid truncation
  max-same-issues: 100
