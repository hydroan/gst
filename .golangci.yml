# golangci-lint configuration for v2.5.0+
# See: https://golangci-lint.run/docs/configuration/

version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly

severity:
  default: error

linters:
  # v2 config does not support `disable-all`; use `default: none` instead
  default: none
  enable:
    # Core correctness.
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Error handling.
    - errorlint
    - errname
    - errchkjson
    - nilerr
    - nilnil
    - nilnesserr

    # Backend resource safety.
    - bidichk
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - durationcheck
    - fatcontext
    - gosec

    # Code hygiene.
    - asciicheck
    - dupword
    - gocheckcompilerdirectives
    - iface
    - makezero
    - mirror
    - misspell
    - musttag
    - nolintlint
    - predeclared
    - reassign
    - recvcheck
    - revive
    - unconvert
    - unparam
    - wastedassign

    # Go modernization.
    - copyloopvar
    - exptostd
    - intrange
    - modernize
    - perfsprint
    - usestdlibvars

    # Broad complementary suite (diagnostic, style, performance).
    - gocritic

    # Test quality.
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - usetesting

    # Project constraints.
    - depguard
    - forbidigo
    - gomoddirectives
    - importas

    # Project-specific checks.
    - canonicalheader
    - loggercheck
    - spancheck

    # Documentation.
    - godoclint

  # Linter-specific settings (moved under linters.settings for v2)
  settings:
    depguard:
      rules:
        main:
          deny:
            - pkg: "errors"
              desc: "Use github.com/cockroachdb/errors instead"
            - pkg: "github.com/pkg/errors"
              desc: "Use github.com/cockroachdb/errors instead"
        # internal/types is the bottom of the framework, the vocabulary every
        # other package shares: it imports the standard library, the leaf
        # packages under it and the third-party types it names, and never a
        # functional package, so that every functional package can depend on
        # it without a cycle. Its tests build fixtures and may import more.
        types-leaf:
          list-mode: strict
          files:
            - "**/internal/types/**"
            - "!$test"
          allow:
            - "$gostd"
            - "github.com/cockroachdb/errors"
            - "github.com/gin-gonic/gin"
            - "github.com/hydroan/gst/internal/apiaction"
            - "github.com/hydroan/gst/internal/datatypes"
            - "github.com/hydroan/gst/internal/execctx"
            - "github.com/hydroan/gst/internal/i18n"
            - "github.com/hydroan/gst/internal/requestctx"
            - "github.com/hydroan/gst/internal/sse"
            - "go.uber.org/zap"
            - "gorm.io/datatypes"
        # Framework code imports the internal packages behind the public
        # forwarding packages; the forwards serve projects (CLAUDE.md, package
        # ownership and internal import direction). The files left out are the
        # ones written as project code: godoc examples, the module sources
        # gg module copy copies into a project (internal/modulemodel/<module>
        # and internal/moduleservice/<module>), the programs gg embeds and
        # builds inside a project (internal/gghelper/program), the middleware
        # and interceptor source files the module manifests name, and
        # module/helloworld, the module example projects are pointed to; so are
        # the external tests of a forwarding package, which import the package
        # they test. A trailing $ matches the package itself and not the
        # packages under it.
        forwarders:
          files:
            - "$all"
            - "!**/example_*_test.go"
            - "!**/error_forward_test.go"
            - "!**/i18n/forward_test.go"
            - "!**/datatypes/forward_test.go"
            - "!**/inspect/inspect_test.go"
            - "!**/service/service_bench_test.go"
            - "!**/service/service_test.go"
            - "!**/cache/cache_benchmark_test.go"
            - "!**/internal/modulemodel/**"
            - "!**/internal/moduleservice/**"
            - "!**/internal/gghelper/program/**"
            - "!**/middleware/iam_session.go"
            - "!**/middleware/authz.go"
            - "!**/interceptor/iam_session.go"
            - "!**/interceptor/authz.go"
            - "!**/module/helloworld/**"
            - "!**/module/version/version.go"
          deny:
            - pkg: "github.com/hydroan/gst$"
              desc: "framework code imports github.com/hydroan/gst/internal/types"
            - pkg: "github.com/hydroan/gst/dsl$"
              desc: "framework code imports github.com/hydroan/gst/internal/dsl; the public package holds the keywords model files call"
            - pkg: "github.com/hydroan/gst/model$"
              desc: "framework code imports github.com/hydroan/gst/internal/model"
            - pkg: "github.com/hydroan/gst/service$"
              desc: "framework code imports github.com/hydroan/gst/internal/service, and internal/apiaction for the phases"
            - pkg: "github.com/hydroan/gst/sse$"
              desc: "framework code imports github.com/hydroan/gst/internal/sse"
            - pkg: "github.com/hydroan/gst/response$"
              desc: "framework code imports github.com/hydroan/gst/internal/response"
            - pkg: "github.com/hydroan/gst/requestctx$"
              desc: "framework code imports github.com/hydroan/gst/internal/requestctx"
            - pkg: "github.com/hydroan/gst/testutil$"
              desc: "framework code imports github.com/hydroan/gst/internal/testutil"
            - pkg: "github.com/hydroan/gst/router$"
              desc: "framework code imports github.com/hydroan/gst/internal/router, and internal/apiaction for APIPath"
            - pkg: "github.com/hydroan/gst/inspect$"
              desc: "framework code imports what it forwards from github.com/hydroan/gst/internal/modelschema, internal/urlquery and internal/model"
            - pkg: "github.com/hydroan/gst/cache$"
              desc: "framework code imports github.com/hydroan/gst/internal/cache/defaultcache, the backend the public package forwards"
            - pkg: "github.com/hydroan/gst/tenant$"
              desc: "framework code imports github.com/hydroan/gst/internal/tenant"
            - pkg: "github.com/hydroan/gst/i18n$"
              desc: "framework code imports github.com/hydroan/gst/internal/i18n; the public package forwards the registration to the module sources"
            - pkg: "github.com/hydroan/gst/datatypes$"
              desc: "framework code imports github.com/hydroan/gst/internal/datatypes; the public package forwards the field types to projects and the module sources"
        # The same rule for the public middleware package: the handlers of
        # the copyable modules are middleware source files gg module copy
        # carries into a project, so they live in the public package, and a
        # project mounts them itself. The package's external tests, and the
        # module tests mounting them as a project does, are left out as
        # above.
        middleware-forwarder:
          files:
            - "$all"
            - "!**/example_*_test.go"
            - "!**/middleware/authz_test.go"
            - "!**/middleware/delay_test.go"
            - "!**/middleware/ip_filter_test.go"
            - "!**/middleware/jwt_test.go"
            - "!**/middleware/request_size_limit_test.go"
            - "!**/middleware/security_headers_test.go"
            - "!**/middleware/security_scheme_test.go"
            - "!**/middleware/timeout_test.go"
            - "!**/internal/modulemodel/**"
            - "!**/internal/moduleservice/**"
            - "!**/module/helloworld/**"
            - "!**/module/*/register_test.go"
          deny:
            - pkg: "github.com/hydroan/gst/middleware$"
              desc: "framework code imports github.com/hydroan/gst/internal/middleware; only the handlers of the modules come from the public package, mounted by the project"
        # The same rule for the public interceptor package, the gRPC
        # counterpart of middleware: the interceptors of the modules are
        # source files gg module copy carries into a project, so they live in
        # the public package, and a project mounts them itself. The package's
        # external tests and the module tests mounting them as a project does
        # are left out.
        interceptor-forwarder:
          files:
            - "$all"
            - "!**/interceptor/*_test.go"
            - "!**/module/*/register_test.go"
          deny:
            - pkg: "github.com/hydroan/gst/interceptor$"
              desc: "framework code imports github.com/hydroan/gst/internal/grpcserver; only the interceptors of the modules come from the public package, mounted by the project"
        # The same rule for the public grpc package, which forwards to the
        # server package and the controller: the interceptors of the modules
        # and the public interceptor package, its counterpart of middleware,
        # spell the call's types by it, and the package's external tests and
        # the module tests mounting them as a project does are left out.
        grpc-forwarder:
          files:
            - "$all"
            - "!**/grpc/*_test.go"
            - "!**/interceptor/*.go"
            - "!**/module/*/interceptor_test.go"
          deny:
            - pkg: "github.com/hydroan/gst/grpc$"
              desc: "framework code imports github.com/hydroan/gst/internal/grpcserver and github.com/hydroan/gst/internal/controller; the public package forwards to them for the generated code and the project"
        # Only the gg command prints. The packages it runs return what they
        # found, or report progress through callbacks the command passes, and
        # the command decides how that shows. The package is imported besides
        # by its own tests and by the test holding the lines of the migration
        # program, which prints inside the project, to the ones gg prints.
        clioutput:
          files:
            - "$all"
            - "!**/cmd/gg/**"
            - "!**/internal/clioutput/**"
            - "!**/internal/gghelper/program/migrate/main_test.go"
          deny:
            - pkg: "github.com/hydroan/gst/internal/clioutput$"
              desc: "only the gg command prints; return the result, or take a progress callback the command passes"
        # The HTTP line and the gRPC line never import each other (CLAUDE.md,
        # the two transports never touch each other): the packages serving
        # HTTP requests, the router, its middleware, the envelope and the
        # registration of the modules, never import the gRPC listener or its
        # interceptors, and the packages serving gRPC calls never import the
        # router, its middleware or the envelope; bootstrap alone wires both.
        # The tests are left out, the module tests mounting both lines the way
        # a project does. depguard matches the absolute path of a file, so a
        # pattern names a package by its directory's name, which names the
        # public package and the internal one under it alike.
        http-line:
          files:
            - "**/middleware/**"
            - "**/router/**"
            - "**/response/**"
            - "**/module/*/register.go"
            - "!$test"
          deny:
            - pkg: "github.com/hydroan/gst/interceptor$"
              desc: "the HTTP line never imports the gRPC line; an interceptor is the gRPC listener's"
            - pkg: "github.com/hydroan/gst/internal/grpcserver$"
              desc: "the HTTP line never imports the gRPC line; the listener is bootstrap's to wire"
            - pkg: "github.com/hydroan/gst/grpc$"
              desc: "the HTTP line never imports the gRPC line; the public grpc package serves the generated code and the interceptors"
        grpc-line:
          files:
            - "**/grpc/**"
            - "**/grpcserver/**"
            - "**/interceptor/**"
            - "!$test"
          deny:
            - pkg: "github.com/hydroan/gst/middleware$"
              desc: "the gRPC line never imports the HTTP line; a middleware is the router's"
            - pkg: "github.com/hydroan/gst/internal/middleware$"
              desc: "the gRPC line never imports the HTTP line; a middleware is the router's"
            - pkg: "github.com/hydroan/gst/router$"
              desc: "the gRPC line never imports the HTTP line; the router is bootstrap's to wire"
            - pkg: "github.com/hydroan/gst/internal/router$"
              desc: "the gRPC line never imports the HTTP line; the router is bootstrap's to wire"
            - pkg: "github.com/hydroan/gst/response$"
              desc: "the gRPC line never imports the HTTP line; the envelope is what the HTTP listener answers in"
            - pkg: "github.com/hydroan/gst/internal/response$"
              desc: "the gRPC line never imports the HTTP line; the envelope is what the HTTP listener answers in"
        # What both lines follow lives in a package neither line owns, so a
        # rule, a type or a helper of both cannot settle in one line's package
        # for the code they share to reach into. The three rules below hold
        # the code outside both lines to that, the lines themselves being held
        # by the two above, so the files of both are left out of each. The
        # gRPC listener is imported, beside its own line, by the files of the
        # controller written for it, which their name says, by bootstrap and
        # by the test support that starts a server.
        shared-not-grpc:
          files:
            - "$all"
            - "!$test"
            - "!**/middleware/**"
            - "!**/router/**"
            - "!**/response/**"
            - "!**/module/*/register.go"
            - "!**/grpc/**"
            - "!**/grpcserver/**"
            - "!**/interceptor/**"
            - "!**/bootstrap/**"
            - "!**/internal/testutil/**"
            - "!**/internal/controller/*_grpc.go"
          deny:
            - pkg: "github.com/hydroan/gst/internal/grpcserver$"
              desc: "code both lines share never imports the gRPC listener; what both lines follow lives in a package neither owns, internal/types for one"
        # The router and its middleware are imported, beside their own line,
        # by bootstrap and by the file registering the routes of the modules.
        shared-not-http:
          files:
            - "$all"
            - "!$test"
            - "!**/middleware/**"
            - "!**/router/**"
            - "!**/response/**"
            - "!**/module/*/register.go"
            - "!**/grpc/**"
            - "!**/grpcserver/**"
            - "!**/interceptor/**"
            - "!**/bootstrap/**"
            - "!**/module/module.go"
          deny:
            - pkg: "github.com/hydroan/gst/internal/middleware$"
              desc: "code both lines share never imports the HTTP middleware; what both lines follow lives in a package neither owns, internal/types for one"
            - pkg: "github.com/hydroan/gst/internal/router$"
              desc: "code both lines share never imports the router; what both lines follow lives in a package neither owns, internal/apiaction for one"
        # The envelope is imported, beside its own line, by the test support
        # reading an answer and by the files of the controller written for
        # HTTP, which their name says.
        shared-not-envelope:
          files:
            - "$all"
            - "!$test"
            - "!**/middleware/**"
            - "!**/router/**"
            - "!**/response/**"
            - "!**/module/*/register.go"
            - "!**/grpc/**"
            - "!**/grpcserver/**"
            - "!**/interceptor/**"
            - "!**/internal/testutil/**"
            - "!**/internal/controller/*_http.go"
          deny:
            - pkg: "github.com/hydroan/gst/internal/response$"
              desc: "code both lines share never imports the HTTP envelope; what both lines follow lives in a package neither owns, internal/types for one"
        # The controller holds both lines, and the name of a file says which it
        # is written for: one ending in _http serves HTTP, one ending in _grpc
        # serves gRPC, and any other holds what both run. So gin and the
        # WebSocket package are imported by the files ending in _http alone,
        # and the gRPC libraries by those ending in _grpc alone, which keeps a
        # flow, a rule or a helper of both free of either transport. The
        # validator both lines check a value with is gin's binding package,
        # which any file may import.
        controller-not-http:
          files:
            - "**/internal/controller/*.go"
            - "!$test"
            - "!**/internal/controller/*_http.go"
          deny:
            - pkg: "github.com/gin-gonic/gin$"
              desc: "in the controller a file ending in _http serves HTTP, and no other imports gin"
            - pkg: "github.com/hydroan/gst/internal/websocket$"
              desc: "in the controller a file ending in _http serves HTTP, and no other imports the WebSocket package"
        controller-not-grpc:
          files:
            - "**/internal/controller/*.go"
            - "!$test"
            - "!**/internal/controller/*_grpc.go"
          deny:
            - pkg: "google.golang.org/grpc"
              desc: "in the controller a file ending in _grpc serves gRPC, and no other imports the gRPC libraries"
            - pkg: "google.golang.org/genproto"
              desc: "in the controller a file ending in _grpc serves gRPC, and no other imports the gRPC libraries"
            - pkg: "google.golang.org/protobuf"
              desc: "in the controller a file ending in _grpc serves gRPC, and no other imports the gRPC libraries"

    errcheck:
      check-type-assertions: true
      exclude-functions:
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)

    forbidigo:
      # Refusing a request outside the controller path goes through
      # response.Abort, the one place the API envelope is written there. gin's
      # own aborts stay reachable on *gin.Context forever, so nothing but this
      # rule stops the next middleware from writing a second envelope shape by
      # hand.
      forbid:
        - pattern: '^.*\.AbortWithStatusJSON$'
          msg: "write the envelope through response.Abort instead of building it by hand"
        - pattern: '^.*\.AbortWithStatus$'
          msg: "an empty body carries no envelope and no trace id; refuse through response.Abort"
        # depguard keeps the standard errors package out, but fmt.Errorf builds
        # an error without a stack just as well; every error of the framework
        # comes from github.com/cockroachdb/errors.
        - pattern: '^fmt\.Errorf$'
          msg: "build errors with github.com/cockroachdb/errors: Newf for a new error, Wrap or Wrapf around a cause"
        # zap.Any types the field by the Go type of its value at run time, so
        # one key can be a string in one entry and a number or an object in
        # another, which a log store mapping keys by type then drops; a field
        # names its type. selfcheck's logfields check holds the key-value pairs
        # to the same rule.
        - pattern: '^zap\.Any$'
          msg: "name the field's type: a typed constructor for a scalar, zap.Reflect for a struct or a map, zap.String with fmt.Sprint for a value of any type"

    godoclint:
      # Default set of rules to enable.
      # Possible values are: `basic`, `all` or `none`.
      # Default: `basic` (enables `pkg-doc`, `single-pkg-doc`, `start-with-name`, and `deprecated`)
      default: basic
      # List of rules to enable in addition to the default set.
      enable:
        # Check proper package-level godoc, if any.
        - pkg-doc
        # Assert at most one godoc per package.
        - single-pkg-doc
        # Check godocs start with the corresponding symbol name.
        - start-with-name
        # Check deprecated symbols have proper deprecation notice.
        - deprecated
      options:
        start-with-name:
          # A doc comment that opens with another declaration's name was
          # left behind by an insertion between a neighbor's comment and its
          # declaration, so every declaration, unexported ones included, must
          # open with its own name. golangci-lint never lets this rule read
          # test files, so their doc comments are held to it by selfcheck's
          # testdoc check instead; godoclint is still kept off the test file
          # exclusions below so that its other rules, deprecated among them,
          # read test files too.
          include-unexported: true

    govet:
      # shadow and nilness are not part of the default go vet analyzer set;
      # make runs them through golangci-lint rather than as standalone binaries.
      enable:
        - shadow
        - nilness
        - unusedwrite
        - reflectvaluecompare
        - deepequalerrors
        - sortslice

    importas:
      # A package a reader meets beside another of the same name goes under
      # one alias wherever it is imported; every other alias is held to a
      # clash in its file by the framework's self check (see
      # internal/cmd/selfcheck), which reads this list.
      no-unaliased: true
      alias:
        # The framework's own packages named like a well-known third-party
        # package.
        - pkg: github.com/hydroan/gst/otel
          alias: gstotel
        - pkg: github.com/hydroan/gst/grpc
          alias: gstgrpc
        - pkg: github.com/hydroan/gst/redis
          alias: gstredis
        - pkg: github.com/hydroan/gst/database/mysql
          alias: gstmysql
        - pkg: github.com/hydroan/gst/database/postgres
          alias: gstpostgres
        - pkg: github.com/hydroan/gst/database/sqlite
          alias: gstsqlite
        # Third-party packages named like a package of the framework or of
        # the standard library.
        - pkg: gorm.io/gorm/logger
          alias: gormlogger
        - pkg: gorm.io/gorm/schema
          alias: gormschema
        - pkg: gorm.io/datatypes
          alias: gormdatatypes
        - pkg: github.com/casbin/casbin/v3/model
          alias: casbinmodel
        - pkg: github.com/gin-gonic/gin/codec/json
          alias: ginjson
        - pkg: github.com/grpc-ecosystem/go-grpc-middleware/v2
          alias: grpcmiddleware
        - pkg: github.com/coder/websocket
          alias: coderwebsocket

    misspell:
      locale: US
      ignore-rules:
        - importas # the linter's name

    recvcheck:
      # Design, GetTableName, Purge and Indexes are stateless declaration
      # methods that use value receivers by framework convention, while
      # stateful hooks require pointer receivers.
      exclusions:
        - "*.Design"
        - "*.GetTableName"
        - "*.Purge"
        - "*.Indexes"

    revive:
      rules:
        - name: blank-imports
        - name: dot-imports
          arguments:
            - allowedPackages:
                - "github.com/hydroan/gst/dsl"
                - "github.com/hydroan/gst/internal/response"
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: var-declaration
        - name: var-naming

    staticcheck:
      checks: ["all", "-QF1008"]
      dot-import-whitelist:
        - github.com/hydroan/gst/dsl

    testpackage:
      # A test file tests its package from outside, through the API callers
      # see, unless its name ends in _internal_test.go -- the form gg check
      # already pairs with a source file (foo_internal_test.go is the internal
      # test of foo.go). The suffix ends the name, so a benchmark is
      # foo_benchmark_internal_test.go. export_test.go gets no pass: the name
      # cannot tell a file that re-exports internals from one that tests an
      # export.go. A main package stays allowed: nothing imports it, so its
      # tests have no outside to test from.
      skip-regexp: _internal_test\.go$
      allow-packages:
        - main

  # Exclusions moved under linters.exclusions for v2
  exclusions:
    generated: strict
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    rules:
      # Relax complexity in tests. unparam is excluded because test helpers
      # commonly keep parameters for signature symmetry across cases.
      - path: _test\.go
        linters:
          - gosec
          - unparam
      # The gofix //go:fix directive is valid but not yet in
      # gocheckcompilerdirectives' known directive list.
      - linters:
          - gocheckcompilerdirectives
        text: "//go:fix"
      # Revive var-naming: ignore ALL_CAPS (redundant with staticcheck) and underscores in names.
      - linters:
          - revive
        text: "don't use (ALL_CAPS|underscores) in Go names"
      # Allow package names "types" and "util" (meaningful in our context).
      - linters:
          - revive
        text: "avoid meaningless package names"
        path: "^(types|util)/|.*/(types|util)/"
      # A CORS preflight is answered with a bare 204 by protocol: the headers
      # are the whole answer and there is no body to put an envelope in.
      - linters:
          - forbidigo
        path: internal/middleware/cors\.go
      # Constants in these packages are named after the string each one
      # stands for: environment variables in config, and the snake case
      # values of the phases in internal/apiaction. The ALL_CAPS and underscored
      # spellings are deliberate and have to match those strings exactly,
      # and an explicit staticcheck checks list turns off golangci's own
      # ST1003 exclusion. The paths are anchored so that packages merely
      # named config elsewhere in the tree stay checked.
      - path: ^(config|internal/apiaction)/
        linters:
          - staticcheck
        text: "ST1003"
      # G101 keys off names containing token/password/secret, which every
      # credential-related environment variable name in config matches.
      - path: ^config/
        linters:
          - gosec
        text: "G101"
      # The response of a WebSocket handshake has no body to close: the
      # library gives the connection of a handshake accepted to the Conn it
      # returns, and of one refused it has read the part it keeps into memory
      # and closed the rest (see Dial in github.com/coder/websocket).
      - linters:
          - bodyclose
        source: 'websocket\.Dial\('

formatters:
  # goimports holds every file to the imports gopls organizes on save: grouped
  # and sorted, and named wherever the package name differs from the name its
  # import path suggests. gofumpt is left to make format: its command reads
  # the module path of each file from the go.mod above it, where the formatter
  # here would take one module path from this file.
  enable:
