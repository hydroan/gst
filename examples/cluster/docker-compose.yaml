# One MySQL and three replicas of the example, all sharing it. The replicas
# run the same image and start together; each publishes its own port and
# writes its logs under ./logs/<replica>, so the scenarios in the README can
# tell them apart. Every replica runs with auto_migrate on: the framework
# serializes table preparation across processes on the server's advisory
# lock, so three replicas creating the schema at once is fine.
x-env: &env
  DATABASE_TYPE: mysql
  DATABASE_AUTO_MIGRATE: "true"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: cluster
  MYSQL_USERNAME: root
  MYSQL_PASSWORD: cluster
  SERVER_PORT: "8080"
  # Once shutdown begins, readiness answers 503 for this long before the
  # listener closes: the time a load balancer needs to stop routing here.
  SERVER_SHUTDOWN_DELAY: 5s
  LOGGER_DIR: /var/log/cluster

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: cluster
      MYSQL_DATABASE: cluster
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcluster"]
      interval: 5s
      timeout: 3s
      retries: 20

  replica1: &replica
    build:
      context: ../..
      dockerfile: examples/cluster/Dockerfile
    image: gst-cluster:dev
    depends_on:
      mysql:
        condition: service_healthy
    environment: *env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/-/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
    # SIGTERM starts the graceful shutdown; the grace period must outlast the
    # drain window and the wait for in-flight jobs, or Docker kills a replica
    # that is still finishing a round.
    stop_grace_period: 40s
    ports:
      - "8081:8080"
    volumes:
      - ./logs/replica1:/var/log/cluster

  replica2:
    <<: *replica
    ports:
      - "8082:8080"
    volumes:
      - ./logs/replica2:/var/log/cluster

  replica3:
    <<: *replica
    ports:
      - "8083:8080"
    volumes:
      - ./logs/replica3:/var/log/cluster
