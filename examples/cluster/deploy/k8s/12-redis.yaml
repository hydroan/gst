# A redis for the example alone, where the iam module keeps the sessions: a
# session established on one replica is read by every other. A real
# deployment brings its own redis; the replicas only need REDIS_ADDR to point
# at it.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: gst-cluster
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: sessions
    app.kubernetes.io/part-of: gst-cluster
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: gst-cluster
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: sessions
    app.kubernetes.io/part-of: gst-cluster
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: sessions
        app.kubernetes.io/part-of: gst-cluster
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image's redis user, so the server starts without root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # The sessions outlive a restart of the container but not the pod:
        # a session lost with the pod is a login away.
        - name: data
          emptyDir: {}
