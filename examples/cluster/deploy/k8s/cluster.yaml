# Three replicas of the example behind one Service. What matters for the
# framework's cluster capabilities:
#
#   - the instance id the framework stamps on every log line and writes into
#     gst_leases.instance starts with the pod name (the host name, plus a
#     random suffix per start), so a lease names the pod holding it;
#   - readiness comes from /-/readyz, which the framework turns off the moment
#     shutdown begins, so the Service stops routing to a draining pod;
#   - terminationGracePeriodSeconds outlasts the framework's whole shutdown
#     at its longest — the drain window, then up to 30 seconds for the HTTP
#     connections, up to 30 seconds for in-flight jobs, and up to 5 seconds
#     each for the tracing exporter and the debug endpoints when they are on —
#     so a pod is never killed while a round is still winding down: the
#     round's context ends as shutdown begins, the round gives its lease back
#     once it returns — cut short, it runs again on another replica — and a
#     new leader is elected within seconds;
#   - readiness fails on the first probe that sees the pod draining, so the
#     Service stops routing to it well within the drain window;
#   - the startup probe covers the time the framework may spend preparing
#     tables when the whole deployment starts against a slow database, so
#     liveness does not restart a pod that is still coming up;
#   - the disruption budget keeps two replicas up through a rolling update or
#     a node drain, so the work never stands still;
#   - every log stream goes to stdout, one line per entry whose logger field
#     names the stream — leader, cronjob, lock, access and the rest — so a
#     deployment's collector ships them like any container output, and the
#     scenarios read them with kubectl logs.
apiVersion: v1
kind: Secret
metadata:
  name: cluster-mysql
type: Opaque
stringData:
  password: cluster
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-env
data:
  DATABASE_TYPE: mysql
  DATABASE_AUTO_MIGRATE: "true"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: cluster
  MYSQL_USERNAME: root
  SERVER_PORT: "8080"
  # Once shutdown begins, readiness answers 503 for this long before the
  # listener closes: the time the endpoints controller needs to take the pod
  # out of the Service.
  SERVER_SHUTDOWN_DELAY: 5s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cluster
  template:
    metadata:
      labels:
        app: cluster
    spec:
      terminationGracePeriodSeconds: 90
      initContainers:
        # The framework fails the start when the database cannot be reached,
        # which is right for a deployment — the orchestrator restarts the
        # pod — but on a first apply MySQL comes up beside the replicas, and
        # waiting for its port keeps that first start free of restarts.
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do sleep 1; done"]
      containers:
        - name: cluster
          image: gst-cluster:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cluster-env
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cluster-mysql
                  key: password
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /-/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /-/readyz
              port: http
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /-/healthz
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: cluster
spec:
  selector:
    app: cluster
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cluster
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: cluster
