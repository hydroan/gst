# Three replicas of the example behind one Service. What matters for the
# framework's cluster capabilities:
#
#   - the instance id the framework stamps on every log line and writes into
#     gst_leases.instance starts with the pod name — the host name, plus a
#     random suffix per start — so a lease names the pod holding it;
#   - /-/readyz turns 503 the moment shutdown begins and the listener closes
#     SERVER_SHUTDOWN_DELAY later, the time the endpoints need to stop sending
#     requests to a terminating pod;
#   - terminationGracePeriodSeconds outlasts the framework's whole shutdown at
#     its longest — the drain window, then up to 30 seconds for the HTTP
#     connections, up to 30 seconds for the work in flight, and up to 5
#     seconds each for the tracing exporter and the debug endpoints when they
#     are on — so a pod is not killed while its work winds down: the work's
#     context ends as shutdown begins, a lease is given back once its work
#     returns — a round cut short runs again on another replica — and a new
#     leader is elected within seconds;
#   - the startup probe covers the time the framework may spend preparing
#     tables while the replicas take turns on an empty database, so liveness
#     does not restart a pod that is still coming up;
#   - every log stream goes to stdout, one line per entry whose logger field
#     names the stream — leader, cronjob, lock, access and the rest — for the
#     node's log collector to ship, and for kubectl logs to read.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster
  namespace: gst-cluster
  labels:
    app.kubernetes.io/name: cluster
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: gst-cluster
data:
  DATABASE_TYPE: mysql
  # Every replica prepares the tables of an empty database at once, to show the
  # framework taking turns. A production deployment runs gg migrate before it
  # rolls out and turns this off.
  DATABASE_AUTO_MIGRATE: "true"
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: cluster
  MYSQL_USERNAME: cluster
  SERVER_PORT: "8080"
  SERVER_SHUTDOWN_DELAY: 5s
  LOGGER_OUTPUT: stdout
  # The replicated cache broadcasts its writes through kafka; every replica
  # opens its cache before it starts serving.
  KAFKA_ENABLED: "true"
  KAFKA_BROKERS: kafka:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster
  namespace: gst-cluster
  labels:
    app.kubernetes.io/name: cluster
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: gst-cluster
spec:
  replicas: 3
  revisionHistoryLimit: 3
  # All three replicas keep serving through a rolling update: a new pod turns
  # ready before an old one is stopped.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: gst-cluster
    spec:
      automountServiceAccountToken: false
      # The Services of the namespace would otherwise inject variables such as
      # MYSQL_PORT=tcp://10.96.0.10:3306, whose names are framework
      # configuration keys: the replicas would read them as configuration.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spreads the replicas over the nodes, so that losing a node leaves the
      # others serving. Uncomment it on a cluster of several nodes.
      # topologySpreadConstraints:
      #   - maxSkew: 1
      #     topologyKey: kubernetes.io/hostname
      #     whenUnsatisfiable: DoNotSchedule
      #     labelSelector:
      #       matchLabels:
      #         app.kubernetes.io/name: cluster
      initContainers:
        # The framework fails the start when the database cannot be reached,
        # which is right for a deployment — the replica is restarted — but on
        # a first apply MySQL comes up beside the replicas, and waiting for its
        # port keeps that first start free of restarts.
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do sleep 1; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: cluster
          image: gst-cluster:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cluster
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql
                  key: password
            # A soft memory limit for the Go runtime a little under the
            # container's, so the garbage collector works harder before the
            # kernel would end the process.
            - name: GOMEMLIMIT
              value: 230MiB
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # A replica that ends with an error — the framework fails a process
          # whose work would not stop once its lease was lost — shows the last
          # lines of its log as the reason in kubectl describe pod.
          terminationMessagePolicy: FallbackToLogsOnError
          startupProbe:
            httpGet:
              path: /-/healthz
              port: http
            periodSeconds: 2
            failureThreshold: 75
          readinessProbe:
            httpGet:
              path: /-/readyz
              port: http
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /-/healthz
              port: http
            periodSeconds: 10
          volumeMounts:
            # The root file system is read-only; the framework keeps a
            # temporary directory of its own.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cluster
  namespace: gst-cluster
  labels:
    app.kubernetes.io/name: cluster
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: gst-cluster
spec:
  selector:
    app.kubernetes.io/name: cluster
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Keeps two replicas up through voluntary disruptions — a node drain, an
# eviction. A rolling update follows the Deployment's strategy instead.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cluster
  namespace: gst-cluster
  labels:
    app.kubernetes.io/name: cluster
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: gst-cluster
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster
