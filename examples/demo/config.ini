[server]
port = 8090

[grpc]
port = 8091

[database]
type = mysql
auto_migrate = true

[mysql]
username = test
password = test
database = test

[redis]
enabled = true

[minio]
enabled = true
endpoint = 127.0.0.1:9000
access_key = minioadmin
secret_key = minioadmin
bucket = demo

; The application's own sections, declared in configx; every key can also come
; from the environment, NOTICE_COUNT for count under [notice].
[notice]
count = 3
event = notice

[cleanup]
audit_days = 30
batch_size = 500
