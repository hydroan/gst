[server]
port = 8092

[grpc]
port = 8093

[database]
type = mysql
auto_migrate = true

[mysql]
username = test
password = test
database = multitenant

[redis]
enabled = true

; The application's own sections, declared in configx; every key can also come
; from the environment, GATEWAY_TENANT_HEADER for tenant_header under [gateway].
[gateway]
; The header a trusted gateway names the tenant in; empty leaves the session's
; tenant alone. Set it only behind a gateway that strips the header from what
; clients send.
tenant_header =

[seed]
; The password every seeded account starts with.
password = 12345678
